<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Hamburguesa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <input type="checkbox" id="toggle-menu" class="toggle-menu">
        <label for="toggle-menu" class="menu-icon">
            <div class="ruedita">
                <div class="ruedita-sol">
                </div>
                <div class="ruedita-luna">
                    <div class="crateres">
                        <div class="crater-1"></div>
                        <div class="crater-2"></div>
                        <div class="crater-3"></div>
                    </div>
                </div>
            </div>
            <div class="fondo-wrapper">
                <div class="fondo-animado">
                    <div class="fondo-night">
                        <span class="star-1">⋆</span>
                        <span class="star-2">⋆</span>
                        <span class="star-3">⋆</span>
                        <span class="star-4">⋆</span>
                        <span class="star-5">⋆</span>
                        <span class="star-6">⋆</span>
                        <span class="star-7">⋆</span>
                        <span class="maxstar-1">✦</span>
                        <span class="maxstar-2">✦</span>
                        <span class="maxstar-3">✦</span>
                        <span class="maxstar-4">✦</span>
                    </div>
                    <div class="fondo-day">
                        <div class="cloud-white">
                            <span class="cloud-1"></span>
                            <span class="cloud-2"></span>
                            <span class="cloud-3"></span>
                            <span class="cloud-4"></span>
                        </div>
                        <div class="cloud-gray">
                            <span class="cloud-1"></span>
                            <span class="cloud-2"></span>
                            <span class="cloud-3"></span>
                            <span class="cloud-4"></span>
                        </div>

                    </div>
                </div>
            </div>
        </label>
    </header>
</body>

</html>
